<!doctype html><html lang="pl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Bot Czat</title><link rel="manifest" href="manifest.json"><meta name="theme-color" content="#1f2937">
<link rel="apple-touch-icon" href="apple-touch-icon.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Bot Czat"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
:root{--bg:#eef1f5;--fg:#111;--card:#fff;--bar:#1f2937;--muted:#777;--in:#fff}
@media(prefers-color-scheme:dark){:root{--bg:#0b0f17;--fg:#e5e7eb;--card:#1f2937;--bar:#111827;--muted:#9ca3af;--in:#111827}}
*{box-sizing:border-box}html,body{height:100%;margin:0}body{font-family:system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--fg);display:flex;flex-direction:column}
header{background:var(--bar);color:#fff;padding:calc(env(safe-area-inset-top) + 10px) 14px 10px;display:flex;align-items:center;gap:8px}
header b{flex:1;font-size:18px}header button,header a{background:none;border:1px solid #fff5;color:#fff;border-radius:14px;padding:4px 10px;font-size:13px;text-decoration:none}
#msgs{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:8px}
.m{max-width:82%;padding:8px 12px;border-radius:16px;background:var(--card);box-shadow:0 1px 2px #0003;word-wrap:break-word;white-space:pre-wrap;line-height:1.35}
.m.me{align-self:flex-end;border-bottom-right-radius:4px}.m:not(.me){border-bottom-left-radius:4px}
.n{font-weight:700;font-size:13px;margin-bottom:2px}.via{font-weight:400;opacity:.7}.t{font-size:10px;opacity:.6;text-align:right;margin-top:3px}
.m code{background:#8883;padding:0 3px;border-radius:4px}.m a{color:inherit}
#st{text-align:center;color:var(--muted);font-size:11px;padding:2px}
form{display:flex;gap:8px;padding:8px 10px calc(env(safe-area-inset-bottom) + 8px);background:var(--card)}
textarea{flex:1;resize:none;border-radius:18px;border:1px solid #8885;padding:9px 14px;font:inherit;font-size:16px;background:var(--in);color:var(--fg);max-height:120px}
form button{border:0;border-radius:50%;width:44px;height:44px;background:#22c55e;color:#fff;font-size:20px}
#setup{position:fixed;inset:0;background:#000a;display:none;align-items:center;justify-content:center;padding:16px;z-index:9}
#setup div{background:var(--card);color:var(--fg);border-radius:16px;padding:18px;max-width:420px;width:100%}
#setup input,#setup select{width:100%;font-size:16px;padding:9px;margin:6px 0 12px;border-radius:10px;border:1px solid #8886;background:var(--in);color:var(--fg)}
#setup button{width:100%;padding:11px;border:0;border-radius:10px;background:#22c55e;color:#fff;font-size:16px;font-weight:600}
small{color:var(--muted)}
</style></head><body>
<header><b>💬 Bot Czat</b><a id="gh" target="_blank">GitHub</a><button id="out" hidden>Wyloguj</button></header>
<div id="msgs"></div><div id="st">Ładowanie…</div>
<form id="f"><textarea id="txt" rows="1" placeholder="Napisz wiadomość…"></textarea><button title="Wyślij">➤</button></form>
<div id="setup"><div>
<h3 style="margin-top:0">Kim jesteś?</h3>
<select id="who"><option>Kacper</option><option>Jakub</option></select>
<label>Token GitHub (fine-grained)</label><input id="tok" type="password" autocomplete="off" placeholder="github_pat_…">
<small>Utwórz go na <a href="https://github.com/settings/personal-access-tokens/new" target="_blank">github.com/settings/personal-access-tokens/new</a>: dostęp tylko do repo <b>bot-czat</b>, uprawnienia <b>Pull requests</b> i <b>Issues</b>: Read and write.<br>Token zostaje tylko w tym telefonie (localStorage) i trafia wyłącznie do api.github.com.</small>
<p><button id="save" type="button">Zapisz</button></p><small><a href="#" id="cancel">Anuluj</a></small>
</div></div>
<script>
const O='kacperkretowicz-wq',R='bot-czat',N=2,U=`https://github.com/${O}/${R}/pull/${N}`,API=`https://api.github.com/repos/${O}/${R}/issues/${N}/comments`;
const $=id=>document.getElementById(id);$('gh').href=U;
let tok=localStorage.getItem('bc_tok'),me=localStorage.getItem('bc_me'),last='';
const COLORS={Wspólny:'#2563eb','Team Bot':'#9333ea',Kacper:'#16a34a',Jakub:'#ea580c'};
function col(n){if(COLORS[n])return COLORS[n];let h=0;for(const c of n)h=h*31+c.charCodeAt(0)&0xffff;return`hsl(${h%360},60%,45%)`}
const esc=s=>s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function md(s){s=esc(s);return s.replace(/`([^`\n]+)`/g,'<code>$1</code>').replace(/\*\*([^*\n]+)\*\*/g,'<b>$1</b>').replace(/(^|\s)\*([^*\n]+)\*/g,'$1<i>$2</i>')
.replace(/\[([^\]\n]+)\]\((https?:\/\/[^\s)]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>').replace(/(^|\s)(https?:\/\/[^\s<]+)/g,'$1<a href="$2" target="_blank" rel="noopener">$2</a>')}
function parse(c){let b=c.body||'',name=c.user.login,via='';const m=b.match(/^\s*\*\*\[([^\]]+)\]\*\*:?\s*/);
if(m){name=m[1];b=b.slice(m[0].length);const k=b.match(/^\s*\[(Kacper|Jakub)\]:?\s*/);if(k){via=name;name=k[1];b=b.slice(k[0].length)}}return{name,via,b}}
function hdr(){return tok?{Authorization:'Bearer '+tok,Accept:'application/vnd.github+json'}:{Accept:'application/vnd.github+json'}}
function ui(){$('out').hidden=!tok}ui();
async function load(){try{let all=[],p=1;for(;;){const r=await fetch(`${API}?per_page=100&page=${p}`,{headers:hdr()});if(!r.ok)throw new Error(r.status===403?'limit API, dodaj token':r.status);const d=await r.json();all=all.concat(d);if(d.length<100)break;p++}
const key=all.map(c=>c.id+c.updated_at).join();if(key!==last){last=key;const box=$('msgs'),bottom=box.scrollTop+box.clientHeight>=box.scrollHeight-80||!box.innerHTML;
box.innerHTML=all.map(c=>{const{name,via,b}=parse(c);return`<div class="m ${me&&name===me?'me':''}"><div class="n" style="color:${col(name)}">${esc(name)}${via?` <span class="via">przez ${esc(via)}</span>`:''}</div>${md(b)}<div class="t">${new Date(c.created_at).toLocaleString('pl-PL',{dateStyle:'short',timeStyle:'short'})}</div></div>`}).join('')||'<div id="st">Brak wiadomości</div>';
if(bottom)box.scrollTop=box.scrollHeight}
$('st').textContent=`${all.length} wiadomości · ${new Date().toLocaleTimeString('pl-PL')}${me?' · jesteś: '+me:''}`}catch(e){$('st').textContent='Błąd: '+e.message+' – ponawiam…'}}
function setup(){$('setup').style.display='flex';if(me)$('who').value=me}
$('save').onclick=()=>{const t=$('tok').value.trim();if(!t)return alert('Wklej token');tok=t;me=$('who').value;localStorage.setItem('bc_tok',tok);localStorage.setItem('bc_me',me);$('tok').value='';$('setup').style.display='none';ui();last='';load()};
$('cancel').onclick=e=>{e.preventDefault();$('setup').style.display='none'};
$('out').onclick=()=>{if(!confirm('Wylogować i usunąć token z tego urządzenia?'))return;localStorage.removeItem('bc_tok');localStorage.removeItem('bc_me');tok=me=null;ui();last='';load()};
$('txt').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey&&!/Mobi/.test(navigator.userAgent)){e.preventDefault();$('f').requestSubmit()}});
$('f').onsubmit=async e=>{e.preventDefault();const t=$('txt').value.trim();if(!t)return;if(!tok||!me)return setup();
try{const r=await fetch(API,{method:'POST',headers:{...hdr(),'Content-Type':'application/json'},body:JSON.stringify({body:`**[${me}]** ${t}`})});
if(!r.ok)throw new Error(r.status+(r.status===401?' – zły token':r.status===403||r.status===404?' – brak uprawnień tokenu':''));$('txt').value='';last='';await load();$('msgs').scrollTop=1e9}catch(err){alert('Nie wysłano: '+err.message)}};
load();setInterval(()=>{if(!document.hidden)load()},localStorage.getItem("tok")?10000:65000);document.addEventListener("visibilitychange",()=>{if(!document.hidden)load()});
if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js');
</script></body></html>
